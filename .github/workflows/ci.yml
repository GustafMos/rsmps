name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Node tests render on the GPU through headless WebGPU; the runner has none, so use Mesa's software Vulkan.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:cli
      # Node tests render on the GPU. On hosted runners that means Mesa's software Vulkan, which has not been
      # proven to work with headless WebGPU yet, so this step reports but does not fail the build.
      - name: Tests (GPU through software Vulkan, informational)
        run: npm test
        continue-on-error: true
