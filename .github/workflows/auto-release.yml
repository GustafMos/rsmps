name: Release on version change

# Every version is released: when package.json on main carries a version that has no GitHub Release yet, this makes one
# (tag v<version> on that commit, release notes = that version's section of CHANGELOG.md, plus the source archives GitHub
# attaches). So releasing is: give the change a version number and a CHANGELOG section, and merge.
# No installers are attached here; the desktop builds are made by release.yml (run manually) and distributed separately.
# A release made by pushing a tag by hand (source-release.yml) is left alone.
on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release this version if it has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} is already released."
            exit 0
          fi
          # exits 1 when CHANGELOG.md has no section for this version: a version is not released without notes
          node desktop/scripts/release-notes.mjs "$version" > notes.md
          gh release create "v${version}" \
            --target "$GITHUB_SHA" \
            --title "RSMPS ${version}" \
            --notes-file notes.md
