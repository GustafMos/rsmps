name: Source release

# Push a tag like v0.5.0 to publish a GitHub Release for that version: release notes from CHANGELOG.md plus the source
# archives GitHub attaches to every release. No installers are attached here; the desktop builds are made by release.yml
# (run manually) and distributed separately. See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag and write the notes
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          node desktop/scripts/release-notes.mjs "$version" > notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "RSMPS ${VERSION}" \
            --notes-file notes.md \
            --verify-tag
