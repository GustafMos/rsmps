name: Release

# Run manually (Actions > Release > Run workflow, on a tag) to build the desktop apps on Windows, macOS and Linux and create a DRAFT
# GitHub Release. Nothing is published automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, target: --win }
          - { name: mac, os: macos-latest, target: --mac }
          - { name: linux, os: ubuntu-latest, target: --linux }
    env:
      # Optional signing secrets. When absent the build is unsigned (the default for now).
      HAS_SIGNING: ${{ (matrix.name == 'windows' && secrets.WIN_CSC_LINK != '') || (matrix.name == 'mac' && secrets.MAC_CSC_LINK != '') }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No GPU tests here: the runners have no GPU. The GPU suite runs in ci.yml.
      - run: npm run typecheck
      - run: npm run build
      - name: Package (unsigned)
        if: env.HAS_SIGNING != 'true'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node desktop/scripts/pack.mjs ${{ matrix.target }} --skip-web
      - name: Package (signed)
        if: env.HAS_SIGNING == 'true'
        shell: bash
        env:
          # Windows uses WIN_CSC_*, macOS uses MAC_CSC_* (a Developer ID Application .p12); both are mapped to the
          # CSC_LINK / CSC_KEY_PASSWORD names electron-builder reads. APPLE_* are used for notarization.
          CSC_LINK: ${{ matrix.name == 'windows' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=""
          if [ "${{ matrix.name }}" = "mac" ]; then
            extra="-c.mac.hardenedRuntime=true"
            if [ "$HAS_NOTARY" = "true" ]; then extra="$extra -c.mac.notarize=true"; fi
          fi
          node desktop/scripts/pack.mjs ${{ matrix.target }} --skip-web $extra
      - uses: actions/upload-artifact@v4
        with:
          name: rsmps-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz

  draft-release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: rsmps-*
          merge-multiple: true
          path: artifacts
      - name: Work out the version and release notes
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          node desktop/scripts/release-notes.mjs "$version" > notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists (the public source release). Installers stay as workflow artifacts."
            exit 0
          fi
          gh release create "v${VERSION}" artifacts/* \
            --draft \
            --title "RSMPS ${VERSION}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}"
